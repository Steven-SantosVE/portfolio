  <!-- Small hanging grass tufts -->
  <g fill="#a9b978">
    <path d="M115 108 q8 38 19 0 q10 45 20 0 q10 31 19 0 l-2 28 h-54z"/>
    <path d="M690 105 q8 34 18 0 q9 42 19 0 q9 28 18 0 l-2 25 h-51z"/>
    <path d="M1115 104 q8 38 18 0 q10 43 20 0 q9 29 18 0 l-2 27 h-52z"/>
    <path d="M1490 100 q8 39 19 0 q9 43 19 0 q9 28 18 0 l-2 28 h-53z"/>
  </g>

  <!-- Tiny decorative stones -->
  <g fill="#d5a6b8" opacity=".75">
    <ellipse cx="330" cy="151" rx="18" ry="7"/>
    <ellipse cx="350" cy="158" rx="10" ry="5"/>
    <ellipse cx="780" cy="145" rx="16" ry="6"/>
    <ellipse cx="800" cy="152" rx="9" ry="4"/>
    <ellipse cx="1215" cy="148" rx="17" ry="6"/>
    <ellipse cx="1237" cy="154" rx="9" ry="4"/>
